<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مغز پروژه — پیمان جهانی محیط زیست</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
  <link rel="stylesheet" href="./brain.css" />
  <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
</head>
<body>
  <header class="hdr">
    <div class="wrap hdr-in">
      <div class="brand">
        <div class="logo">GPE</div>
        <div><b>مغز پروژه</b><span>پیمان جهانی محیط زیست</span></div>
      </div>
      <nav class="tabs" id="tabs">
        <button class="tab active" data-view="overview">نمای کلی</button>
        <button class="tab" data-view="graph">نقشه دانش</button>
        <button class="tab" data-view="matrix">ماتریس ارتباط</button>
        <button class="tab" data-view="dossiers">پرونده منابع</button>
        <button class="tab" data-view="chapters">نمای رساله</button>
        <button class="tab" data-view="gaps">شکاف‌ها و نوآوری</button>
      </nav>
      <div class="hdr-tools">
        <button class="icon-btn" id="themeBtn" title="تغییر تم">🌙</button>
      </div>
    </div>
  </header>

  <main class="wrap" id="main">
    <div class="loading" id="loading">در حال بارگذاری مغز پروژه…</div>

    <!-- OVERVIEW -->
    <section class="view active hero" id="view-overview"></section>
    <!-- GRAPH -->
    <section class="view" id="view-graph"></section>
    <!-- MATRIX -->
    <section class="view" id="view-matrix"></section>
    <!-- DOSSIERS -->
    <section class="view" id="view-dossiers"></section>
    <!-- CHAPTERS -->
    <section class="view" id="view-chapters"></section>
    <!-- GAPS -->
    <section class="view" id="view-gaps"></section>
  </main>

  <div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

  <footer class="ft">
    <div class="wrap">
      <p id="ftmeta">مغز پروژه — سامانه سوارم پژوهشی</p>
    </div>
  </footer>

  <script src="./brain.js"></script>
</body>
</html>
