<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Brain — پیمان جهانی محیط زیست</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
  <link rel="stylesheet" href="./brain.css" />
  <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- 3D knowledge graph (solid spheres, force-directed) -->
  <script src="https://unpkg.com/3d-force-graph@1.73.4/dist/3d-force-graph.min.js"></script>
</head>
<body>
  <!-- Ambient glow blobs -->
  <div class="ambient a1"></div>
  <div class="ambient a2"></div>
  <div class="ambient a3"></div>

  <header class="hdr">
    <div class="wrap hdr-in">
      <div class="brand">
        <div class="logo-ring"><div class="logo">GPE</div></div>
        <div class="brand-text">
          <b>Project Brain</b>
          <span>Global Pact for the Environment — Dissertation Research Intelligence</span>
        </div>
      </div>
      <nav class="tabs" id="tabs">
        <button class="tab active" data-view="overview"><i data-lucide="layout-dashboard" class="tab-ic"></i><span>نمای کلی</span></button>
        <button class="tab" data-view="graph"><i data-lucide="share-2" class="tab-ic"></i><span>نقشه دانش</span></button>
        <button class="tab" data-view="matrix"><i data-lucide="grid-3x3" class="tab-ic"></i><span>ماتریس</span></button>
        <button class="tab" data-view="dossiers"><i data-lucide="library" class="tab-ic"></i><span>پرونده‌ها</span></button>
        <button class="tab" data-view="chapters"><i data-lucide="book-open" class="tab-ic"></i><span>فصل‌ها</span></button>
        <button class="tab" data-view="thesis"><i data-lucide="file-pen-line" class="tab-ic"></i><span>نگارش رساله</span></button>
        <button class="tab tab-hi" data-view="compile"><i data-lucide="book-marked" class="tab-ic"></i><span>تدوین پایان‌نامه</span></button>
        <button class="tab" data-view="review"><i data-lucide="clipboard-check" class="tab-ic"></i><span>نقد و سناریو</span></button>
        <button class="tab" data-view="proof"><i data-lucide="badge-check" class="tab-ic"></i><span>سندِ فرایند</span></button>
        <button class="tab" data-view="gaps"><i data-lucide="scan-search" class="tab-ic"></i><span>شکاف‌ و نوآوری</span></button>
        <button class="tab" data-view="databases"><i data-lucide="database" class="tab-ic"></i><span>پایگاه‌های استنادی</span></button>
        <button class="tab tab-hi" data-view="digest"><i data-lucide="brain-circuit" class="tab-ic"></i><span>هضم منابع</span></button>
        <button class="tab" data-view="findings"><i data-lucide="compass" class="tab-ic"></i><span>نتایج و مسیر پژوهش</span></button>
      </nav>
      <div class="hdr-tools">
        <button class="icon-btn" id="themeBtn" title="تغییر تم">
          <i data-lucide="moon" id="themeIcon"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap" id="main">
    <div class="loading" id="loading">
      <div class="pulse-ring"></div>
      <p>در حال بارگذاری مغز پروژه…</p>
    </div>

    <section class="view active" id="view-overview"></section>
    <section class="view" id="view-graph"></section>
    <section class="view" id="view-matrix"></section>
    <section class="view" id="view-dossiers"></section>
    <section class="view" id="view-chapters"></section>
    <section class="view" id="view-thesis"></section>
    <section class="view" id="view-compile"></section>
    <section class="view" id="view-review"></section>
    <section class="view" id="view-proof"></section>
    <section class="view" id="view-gaps"></section>
    <section class="view" id="view-databases"></section>
    <section class="view" id="view-digest"></section>
    <section class="view" id="view-findings"></section>
  </main>

  <div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

  <footer class="ft">
    <div class="wrap ft-in">
      <p id="ftmeta">Project Brain — Research Swarm System</p>
      <p class="ft-attr">HJR's Agentic Architecture @2026 — Dedicated for Dr. Masoud Ahsannejad</p>
    </div>
  </footer>

  <script src="./brain.js"></script>
</body>
</html>
