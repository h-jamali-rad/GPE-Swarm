  <text x="305" y="126" fill="#999" font-size="11" direction="rtl">−۴۶ تکراری حذف شد</text>
  <rect x="70" y="150" width="380" height="64" rx="14" fill="#1b8a5a" filter="url(#sh)"/>
  <circle cx="416" cy="182" r="22" fill="rgba(255,255,255,.22)"/>
  <text x="416" y="189" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">۱۶۸</text>
  <text x="245" y="188" text-anchor="middle" fill="#fff" font-size="15" direction="rtl">پس از حذف تکراری  (Screened)</text>
  <line x1="260" y1="217" x2="260" y2="267" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <text x="305" y="246" fill="#999" font-size="11" direction="rtl">−۱۱۹ فاقد ارتباط مستقیم</text>
  <rect x="70" y="270" width="380" height="64" rx="14" fill="#f0a500" filter="url(#sh)"/>
  <circle cx="416" cy="302" r="22" fill="rgba(255,255,255,.22)"/>
  <text x="416" y="309" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">۴۹</text>
  <text x="245" y="308" text-anchor="middle" fill="#fff" font-size="15" direction="rtl">واجد شرایط  (Eligible)</text>
