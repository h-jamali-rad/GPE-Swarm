  <text x="305" y="366" fill="#999" font-size="11" direction="rtl">−۱۷ فاقد اعتبار کافی</text>
  <rect x="70" y="390" width="380" height="64" rx="14" fill="#c0392b" filter="url(#sh)"/>
  <circle cx="416" cy="422" r="22" fill="rgba(255,255,255,.22)"/>
  <text x="416" y="429" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">۳۲</text>
  <text x="245" y="428" text-anchor="middle" fill="#fff" font-size="15" direction="rtl">وارد‌شدهٔ نهایی  (Included)</text>
