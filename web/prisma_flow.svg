<svg xmlns="http://www.w3.org/2000/svg" width="520" height="484" viewBox="0 0 520 484">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&amp;display=swap');
    text { font-family: 'Vazirmatn', 'B Nazanin', 'Arial', sans-serif; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <filter id="sh"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".12"/></filter>
  </defs>
  <rect width="520" height="484" fill="#f8f9fb" rx="16"/>
  <text x="260" y="22" text-anchor="middle" fill="#14243f" font-size="13" font-weight="700" direction="rtl">نمودار ۱-۱: فرایند غربال‌گری منابع (PRISMA)</text>
  <rect x="70" y="30" width="380" height="64" rx="14" fill="#1b4965" filter="url(#sh)"/>
  <circle cx="416" cy="62" r="22" fill="rgba(255,255,255,.22)"/>
  <text x="416" y="69" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">۲۱۴</text>
  <text x="245" y="68" text-anchor="middle" fill="#fff" font-size="15" direction="rtl">شناسایی‌شده  (Identified)</text>
